[workspace]
resolver = "3"
members = ["crates/chordkit", "crates/chordkit-kde"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/chordkit"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
thiserror = "2"
serde = "1"
serde_json = "1"
chordkit = { path = "crates/chordkit" }
